[package]
name = "block_wallet"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Self-custody Bitcoin, Ethereum, Solana, Litecoin and Monero wallet for the Librem 5"
license = "GPL-3.0-or-later"
readme = "README.md"
authors = ["Block Breakers"]
homepage = "https://github.com/BlockBreakersHQ/BlockWallet"
repository = "https://github.com/BlockBreakersHQ/BlockWallet"
keywords = ["bitcoin", "ethereum", "monero", "wallet", "librem"]
categories = ["gui"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# v1_2 for AdwEntryRow/AdwPasswordEntryRow, which the settings and send forms are built
# on. Deliberately not higher: v1_4 would buy only AdwSwitchRow, and `ui::add_switch_row`
# hand-builds that from AdwActionRow + GtkSwitch instead, so the .deb path still builds on
# Debian bookworm (libadwaita 1.2). packaging/debian/control carries the matching floor.
adw = { version = "0.8", package = "libadwaita", features = ["v1_2"] }
async-channel = "2"
alloy = { version = "1", default-features = false, features = ["std", "providers", "reqwest", "rpc-types", "signer-local", "signer-mnemonic", "network"] }
argon2 = { version = "0.5", features = ["std"] }
bdk_wallet = { version = "1", features = ["keys-bip39"] }
# Must be an https-capable feature, not plain `blocking`. The bare `blocking` feature builds
# the minreq backend with no TLS at all, so every request to an https Esplora server failed
# immediately with `HttpsFeatureNotEnabled`. The balance loop reported that as "offline",
# which made a build-time misconfiguration look exactly like a network outage. Every default
# Esplora endpoint this wallet ships is https, so Bitcoin sync could never have worked.
#
# `-native` rather than `-rustls` here, despite the rustls preference for bdk_electrum below.
# esplora-client's rustls feature pins rustls 0.21, an end-of-life line that no longer gets
# security fixes, and a wallet should not be handling node connections over one. native-tls
# is already in the tree via reqwest, so this adds no crate at all and introduces no third
# TLS stack.
bdk_esplora = { version = "0.20", default-features = false, features = ["blocking-https-native"] }
# `ring` rather than the default `aws-lc-rs` rustls provider. aws-lc-rs drags in
# aws-lc-sys, which needs cmake and builds a large C library — a real problem on the
# Librem 5 (4 slow cores, 3 GB RAM) and an extra build-dep for the .deb. `use-rustls-ring`
# still gives TLS 1.2 + 1.3 with webpki roots, and `proxy` support is pinned by
# bdk_electrum itself so Tor/SOCKS is unaffected.
bdk_electrum = { version = "0.20", default-features = false, features = ["use-rustls-ring"] }
chacha20poly1305 = "0.10"
chrono = "0.4.23"
colored = "2.0.0"
directories = "5"
fast_qr = { version = "0.12", features = ["image"] }
gdk4 = { version = "0.10", features = ["v4_6"] }
gio = "0.21"
glib = "0.21"
gtk = { version = "0.10", package = "gtk4" }
hex = "0.4.3"
image = "0.24.5"
# Monero. monero-oxide (the library formerly known as monero-serai) does the parts of Monero
# that must not be hand-rolled: output scanning, CLSAG ring signatures and Bulletproofs+.
# It is pure Rust on top of curve25519-dalek, which is already in the tree for Solana, so it
# adds no C library and no cmake, which is what keeps the Librem 5 build feasible. Only the
# daemon *interface* crate is taken, not its HTTP transport: `xmr_chain.rs` implements the
# one-method transport trait over the reqwest client this wallet already ships, so Monero
# does not introduce a second HTTP stack or a second TLS stack.
monero-wallet = "0.2"
monero-daemon-rpc = "0.2"
pango = "0.21"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rustc-hex = "2.1.0"
serde = { version = "1.0.152", features = ["derive", "rc"] }
serde_json = "1.0.91"
sha2 = "0.10"
bech32 = "0.12"
bip39 = "2"
bs58 = "0.5"
curve25519-dalek = "4"
ed25519-dalek = "2"
slip10_ed25519 = "0.1"
tokio = { version = "1.24.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[build-dependencies]
glib-build-tools = "0.21"
